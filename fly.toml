app = 'project-game-green-sunset-7150'
primary_region = 'sin'

[build]

[env]
  NODE_ENV = "production"
  PORT = "8080"
  DB_PATH = "/data/game.db"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[mounts]
  source = "data"
  destination = "/data"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
